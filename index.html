<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL: MISSION COMPLETE</title>
    <style>
        body {
            margin: 0; background: #050505; color: #00e6ff;
            font-family: 'Courier New', monospace; overflow: hidden;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        #game-container { position: relative; text-align: center; width: 450px; }
        .header { font-size: 20px; margin-bottom: 10px; text-shadow: 0 0 10px #00e6ff; }
        .sub-text { font-size: 12px; color: #555; margin-bottom: 20px; }
        #lives-container { color: #ff3333; font-weight: bold; margin-bottom: 10px; font-size: 18px; }

        /* Page Transitions */
        #stage-lockpick, #stage-letter-rain, #fail-page, #win-page { display: none; }
        .active { display: block !important; }
        .flex-active { display: flex !important; }

        .fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100;
            flex-direction: column; justify-content: center; align-items: center;
        }

        /* Success Page Styles */
        #win-page { color: #00ff88; border: 10px double #00ff88; }
        .score-box { background: rgba(0,255,136,0.1); padding: 20px; border: 1px solid #00ff88; margin: 20px; min-width: 300px; }
        .stat-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 18px; }

        /* Fail Page Styles */
        #fail-page { color: #ff3333; }
        .glitch-text { font-size: 50px; animation: shake 0.1s infinite; }

        /* UI Elements */
        canvas { background: rgba(0, 230, 255, 0.02); border-radius: 10px; cursor: crosshair; }
        .bar-bg { width: 30%; height: 12px; background: #111; border: 1px solid #333; }
        .bar-fill { height: 100%; width: 0%; background: #ff8c00; box-shadow: 0 0 10px #ff8c00; transition: 0.2s; }
        .progress-container { display: flex; justify-content: space-between; margin-top: 15px; }

        .btn {
            padding: 15px 40px; margin-top: 20px; cursor: pointer;
            background: none; font-family: inherit; font-weight: bold; text-transform: uppercase;
        }
        .btn-win { border: 2px solid #00ff88; color: #00ff88; }
        .btn-win:hover { background: #00ff88; color: #000; }
        .btn-fail { border: 2px solid #ff3333; color: #ff3333; }

        @keyframes shake { 0% { transform: translate(2px,2px); } 50% { transform: translate(-2px,-2px); } 100% { transform: translate(0,0); } }
    </style>
</head>
<body>

    <div id="win-page" class="fullscreen-overlay">
        <div style="font-size: 50px; font-weight: bold;">MISSION ACCOMPLISHED</div>
        <div class="score-box">
            <div class="stat-row"><span>STATUS:</span> <span style="color:#fff">SUCCESSFUL</span></div>
            <div class="stat-row"><span>HACK PERCENT:</span> <span style="color:#fff">100%</span></div>
            <div class="stat-row"><span>LIVES REMAINING:</span> <span id="final-lives" style="color:#fff"></span></div>
            <hr style="border: 0; border-top: 1px solid #00ff88;">
            <div class="stat-row" style="font-size: 24px;"><span>FINAL SCORE:</span> <span id="final-score" style="color:#fff"></span></div>
        </div>
        <button class="btn btn-win" onclick="location.reload()">NEW CONTRACT</button>
    </div>

    <div id="fail-page" class="fullscreen-overlay">
        <div class="glitch-text">ACCESS DENIED</div>
        <p>SYSTEM LOCKOUT IN EFFECT. ASSETS SEIZED.</p>
        <button class="btn btn-fail" onclick="location.reload()">RE-INITIALIZE</button>
    </div>

    <div id="game-container">
        <div id="stage-lockpick" class="active">
            <div class="header">STAGE 1: HARDWARE BYPASS</div>
            <div class="sub-text">CLICK OR SPACEBAR TO SET PINS</div>
            <canvas id="lock-canvas" width="350" height="350"></canvas>
            <div class="progress-container">
                <div class="bar-bg"><div id="l1" class="bar-fill"></div></div>
                <div class="bar-bg"><div id="l2" class="bar-fill"></div></div>
                <div class="bar-bg"><div id="l3" class="bar-fill"></div></div>
            </div>
        </div>

        <div id="stage-letter-rain">
            <div id="lives-container">TRACE ALERT: <span id="lives-display">0 / 5</span></div>
            <div class="header">STAGE 2: PACKET DECRYPTION (<span id="hack-pc">0</span>%)</div>
            <canvas id="rain-canvas" width="400" height="500"></canvas>
        </div>
    </div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(freq, type, dur) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.connect(gain); gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    let currentStage = 1;
    let lockProgress = [0, 0, 0], activeLock = 0;
    let hackProgress = 0, errors = 0, maxErrors = 5;
    let letters = [], rainTimeout, isGlitching = false;
    let totalKeysPressed = 0;

    // --- STAGE 1: LOCKPICK ---
    const lCanvas = document.getElementById('lock-canvas');
    const lCtx = lCanvas.getContext('2d');
    let cursor = { angle: 0, speed: 0.05, dir: 1 };
    let target = { center: Math.random() * Math.PI * 2, width: 0.5 };

    function drawLockpick() {
        if (currentStage !== 1) return;
        lCtx.clearRect(0,0,350,350);
        lCtx.strokeStyle = "#222"; lCtx.lineWidth = 15;
        lCtx.beginPath(); lCtx.arc(175, 175, 130, 0, Math.PI*2); lCtx.stroke();
        lCtx.strokeStyle = "#00e6ff";
        lCtx.beginPath(); lCtx.arc(175, 175, 130, target.center - target.width/2, target.center + target.width/2); lCtx.stroke();
        cursor.angle += cursor.speed * cursor.dir;
        lCtx.strokeStyle = "#fff"; lCtx.lineWidth = 6;
        lCtx.beginPath();
        lCtx.moveTo(175 + 110 * Math.cos(cursor.angle), 175 + 110 * Math.sin(cursor.angle));
        lCtx.lineTo(175 + 145 * Math.cos(cursor.angle), 175 + 145 * Math.sin(cursor.angle));
        lCtx.stroke();
        requestAnimationFrame(drawLockpick);
    }

    function checkLock() {
        let diff = Math.abs(((cursor.angle % (Math.PI*2)) + (Math.PI*2)) % (Math.PI*2) - target.center);
        if (diff < target.width/2) {
            playSfx(800, 'sine', 0.1);
            lockProgress[activeLock] += 34;
            document.getElementById(`l${activeLock+1}`).style.width = lockProgress[activeLock] + "%";
            if (lockProgress[activeLock] >= 100) { playSfx(1200, 'square', 0.2); activeLock++; }
            if (activeLock > 2) transitionToRain();
            target.center = Math.random() * Math.PI * 2;
        } else {
            playSfx(100, 'sawtooth', 0.2);
            lockProgress[activeLock] = 0;
            document.getElementById(`l${activeLock+1}`).style.width = "0%";
            document.body.style.animation = "shake 0.2s";
            setTimeout(() => document.body.style.animation = "", 200);
        }
        cursor.dir *= -1;
    }

    // --- STAGE 2: RAIN ---
    const rCanvas = document.getElementById('rain-canvas');
    const rCtx = rCanvas.getContext('2d');

    function transitionToRain() {
        currentStage = 2;
        document.getElementById('stage-lockpick').classList.remove('active');
        document.getElementById('stage-letter-rain').classList.add('active');
        spawnLetter();
        drawRain();
        setInterval(() => { if(currentStage === 2) triggerDestruction(); }, 6000);
    }

    function triggerDestruction() {
        isGlitching = true; playSfx(50, 'sawtooth', 0.3);
        letters.forEach(l => { l.char = Math.floor(Math.random()*10).toString(); l.isNum = true; });
        setTimeout(() => isGlitching = false, 2500);
    }

    function spawnLetter() {
        if (currentStage !== 2) return;
        let lane = [50, 150, 250, 350][Math.floor(Math.random()*4)];
        let char = isGlitching ? Math.floor(Math.random()*10).toString() : "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[Math.floor(Math.random()*26)];
        letters.push({ x: lane, y: -20, char: char, isNum: isGlitching });
        rainTimeout = setTimeout(spawnLetter, Math.max(250, 1000 - (hackProgress * 9)));
    }

    function drawRain() {
        if (currentStage !== 2) return;
        rCtx.clearRect(0,0,400,500);
        letters.forEach((l, i) => {
            l.y += 2.2 + (hackProgress / 18);
            rCtx.fillStyle = l.isNum ? "rgba(255,0,0,0.2)" : "rgba(0,230,255,0.15)";
            rCtx.strokeStyle = l.isNum ? "#ff3333" : "#00e6ff";
            rCtx.fillRect(l.x-35, l.y-25, 70, 50); rCtx.strokeRect(l.x-35, l.y-25, 70, 50);
            rCtx.fillStyle = "#fff"; rCtx.font = "bold 26px Arial"; rCtx.textAlign = "center";
            rCtx.fillText(l.char, l.x + (l.isNum?Math.random()*3:0), l.y + 10);
            if (l.y > 485) { letters.splice(i, 1); handleError(); }
        });
        requestAnimationFrame(drawRain);
    }

    function handleError() {
        playSfx(150, 'sawtooth', 0.2); errors++;
        document.getElementById('lives-display').innerText = `${errors} / ${maxErrors}`;
        if (errors >= maxErrors) { currentStage = 0; document.getElementById('fail-page').classList.add('flex-active'); }
    }

    function finishHack() {
        currentStage = 0;
        clearTimeout(rainTimeout);
        let finalScore = (hackProgress * 50) + ((maxErrors - errors) * 500) - (totalKeysPressed * 2);
        document.getElementById('final-lives').innerText = (maxErrors - errors) + " Left";
        document.getElementById('final-score').innerText = Math.max(0, Math.floor(finalScore));
        document.getElementById('win-page').classList.add('flex-active');
        playSfx(600, 'sine', 0.5);
    }

    window.addEventListener('keydown', (e) => {
        if (currentStage === 1 && e.code === 'Space') checkLock();
        if (currentStage === 2) {
            totalKeysPressed++;
            let key = e.key.toUpperCase();
            let idx = letters.findIndex(l => l.char === key);
            if (idx !== -1) {
                playSfx(1000, 'sine', 0.05); letters.splice(idx, 1);
                hackProgress += 2.5; document.getElementById('hack-pc').innerText = Math.floor(hackProgress);
                if (hackProgress >= 100) finishHack();
            } else { handleError(); }
        }
    });

    lCanvas.addEventListener('mousedown', () => { if(currentStage===1) checkLock(); });
    drawLockpick();
</script>
</body>
</html>
