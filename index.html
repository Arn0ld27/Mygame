<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL: WORD BREACH ONLY</title>
    <style>
        body {
            margin: 0; background: #050505; color: #00e6ff;
            font-family: 'Courier New', monospace; overflow: hidden;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        #game-container { position: relative; text-align: center; width: 500px; }
        .header { font-size: 22px; margin-bottom: 10px; text-shadow: 0 0 10px #00e6ff; font-weight: bold; }
        .sub-text { font-size: 12px; color: #555; margin-bottom: 20px; }
        #lives-container { color: #ff3333; font-weight: bold; margin-bottom: 10px; font-size: 18px; letter-spacing: 1px; }

        #stage-lockpick, #stage-letter-rain, #fail-page, #win-page { display: none; }
        .active { display: block !important; }
        .flex-active { display: flex !important; }

        .fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100;
            flex-direction: column; justify-content: center; align-items: center;
        }

        #win-page { color: #00ff88; border: 10px double #00ff88; }
        .score-box { background: rgba(0,255,136,0.1); padding: 20px; border: 1px solid #00ff88; margin: 20px; min-width: 300px; }
        .stat-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 18px; }

        canvas { background: rgba(0, 230, 255, 0.02); border-radius: 10px; box-shadow: inset 0 0 20px rgba(0,230,255,0.05); }
        .bar-bg { width: 30%; height: 12px; background: #111; border: 1px solid #333; }
        .bar-fill { height: 100%; width: 0%; background: #ff8c00; box-shadow: 0 0 10px #ff8c00; transition: 0.2s; }
        .progress-container { display: flex; justify-content: space-between; margin-top: 15px; }

        .btn { padding: 15px 40px; margin-top: 20px; cursor: pointer; background: none; font-family: inherit; font-weight: bold; color: inherit; border: 2px solid; transition: 0.2s; }
        .btn:hover { background: rgba(255,255,255,0.1); }

        @keyframes shake { 0% { transform: translate(2px,2px); } 50% { transform: translate(-2px,-2px); } 100% { transform: translate(0,0); } }
    </style>
</head>
<body>

    <div id="win-page" class="fullscreen-overlay">
        <div style="font-size: 40px; font-weight: bold;">MISSION ACCOMPLISHED</div>
        <div class="score-box">
            <div class="stat-row"><span>SYSTEM STATUS:</span> <span style="color:#fff">BYPASSED</span></div>
            <div class="stat-row"><span>INTEGRITY:</span> <span id="final-lives" style="color:#fff"></span></div>
            <div class="stat-row" style="font-size: 24px;"><span>RANK SCORE:</span> <span id="final-score" style="color:#fff"></span></div>
        </div>
        <button class="btn" onclick="location.reload()">NEW CONTRACT</button>
    </div>

    <div id="fail-page" class="fullscreen-overlay">
        <div style="font-size: 50px; color: #ff3333; font-weight: bold;">ACCESS DENIED</div>
        <p>TRACE DETECTED. NEURAL LINK DISCONNECTED.</p>
        <button class="btn" style="border-color: #ff3333; color: #ff3333;" onclick="location.reload()">RE-INITIALIZE</button>
    </div>

    <div id="game-container">
        <div id="stage-lockpick" class="active">
            <div class="header">STAGE 1: HARDWARE OVERRIDE</div>
            <div class="sub-text">REVERSE DIRECTION TO SET THE PINS</div>
            <canvas id="lock-canvas" width="350" height="350"></canvas>
            <div class="progress-container">
                <div class="bar-bg"><div id="l1" class="bar-fill"></div></div>
                <div class="bar-bg"><div id="l2" class="bar-fill"></div></div>
                <div class="bar-bg"><div id="l3" class="bar-fill"></div></div>
            </div>
        </div>

        <div id="stage-letter-rain">
            <div id="lives-container">TRACE ALERT: <span id="lives-display">0 / 5</span></div>
            <div class="header">STAGE 2: DECRYPTION SEQUENCER (<span id="hack-pc">0</span>%)</div>
            <div style="font-size: 14px; color: #ff8c00; margin-bottom: 10px;">BUFFER: <span id="typing-buffer" style="color:#fff; border-bottom: 2px solid #00e6ff; padding: 0 5px;">_</span></div>
            <canvas id="rain-canvas" width="450" height="500"></canvas>
        </div>
    </div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(freq, type, dur) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.connect(gain); gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    let currentStage = 1, activeLock = 0, lockProgress = [0,0,0];
    let hackProgress = 0, errors = 0, maxErrors = 5, words = [], rainTimeout;
    let typingBuffer = "";

    // Word list - No numbers included
    const wordList = ["HACK", "DATA", "VOID", "USER", "ROOT", "CODE", "BYTE", "KILL", "LOCK", "HOST", "LINK", "PING", "FIREWALL", "SERVER", "SYSTEM", "ENCRYPT", "ACCESS", "BYPASS", "CYBER", "SATELLITE", "PROXY", "MAINFRAME", "BITCOIN", "OVERRIDE", "PROTOCOL"];

    // --- STAGE 1 LOGIC ---
    const lCanvas = document.getElementById('lock-canvas');
    const lCtx = lCanvas.getContext('2d');
    let cursor = { angle: 0, speed: 0.05, dir: 1 };
    let target = { center: Math.random() * Math.PI * 2, width: 0.5 };

    function drawLockpick() {
        if (currentStage !== 1) return;
        lCtx.clearRect(0,0,350,350);
        lCtx.strokeStyle = "#222"; lCtx.lineWidth = 15;
        lCtx.beginPath(); lCtx.arc(175, 175, 130, 0, Math.PI*2); lCtx.stroke();
        lCtx.strokeStyle = "#00e6ff";
        lCtx.beginPath(); lCtx.arc(175, 175, 130, target.center - target.width/2, target.center + target.width/2); lCtx.stroke();
        cursor.angle += cursor.speed * cursor.dir;
        lCtx.strokeStyle = "#fff"; lCtx.lineWidth = 6;
        lCtx.beginPath();
        lCtx.moveTo(175 + 110 * Math.cos(cursor.angle), 175 + 110 * Math.sin(cursor.angle));
        lCtx.lineTo(175 + 145 * Math.cos(cursor.angle), 175 + 145 * Math.sin(cursor.angle));
        lCtx.stroke();
        requestAnimationFrame(drawLockpick);
    }

    function checkLock() {
        let diff = Math.abs(((cursor.angle % (Math.PI*2)) + (Math.PI*2)) % (Math.PI*2) - target.center);
        if (diff < target.width/2) {
            playSfx(800, 'sine', 0.1);
            lockProgress[activeLock] += 34;
            document.getElementById(`l${activeLock+1}`).style.width = lockProgress[activeLock] + "%";
            if (lockProgress[activeLock] >= 100) { playSfx(1200, 'square', 0.2); activeLock++; }
            if (activeLock > 2) transitionToRain();
            target.center = Math.random() * Math.PI * 2;
        } else {
            playSfx(100, 'sawtooth', 0.2);
            lockProgress[activeLock] = 0;
            document.getElementById(`l${activeLock+1}`).style.width = "0%";
            document.body.style.animation = "shake 0.2s";
            setTimeout(() => document.body.style.animation = "", 200);
        }
        cursor.dir *= -1;
    }

    // --- STAGE 2 LOGIC ---
    const rCanvas = document.getElementById('rain-canvas');
    const rCtx = rCanvas.getContext('2d');

    function transitionToRain() {
        currentStage = 2;
        document.getElementById('stage-lockpick').classList.remove('active');
        document.getElementById('stage-letter-rain').classList.add('active');
        spawnWord();
        drawRain();
    }

    function spawnWord() {
        if (currentStage !== 2) return;
        // Lane positions adjusted for wider word boxes
        let lane = [70, 190, 310, 400][Math.floor(Math.random()*4)];
        let wordText = wordList[Math.floor(Math.random()*wordList.length)];
        words.push({ x: lane, y: -40, text: wordText });
        
        // Spawn speed increases as hack progresses
        rainTimeout = setTimeout(spawnWord, Math.max(700, 1800 - (hackProgress * 12)));
    }

    function drawRain() {
        if (currentStage !== 2) return;
        rCtx.clearRect(0,0,450,500);
        
        words.forEach((w, i) => {
            w.y += 1.3 + (hackProgress / 25);
            
            // Draw Container Box
            rCtx.fillStyle = "rgba(0, 230, 255, 0.1)";
            rCtx.strokeStyle = "#00e6ff";
            rCtx.lineWidth = 1;
            let boxWidth = rCtx.measureText(w.text).width + 30;
            rCtx.fillRect(w.x - boxWidth/2, w.y - 20, boxWidth, 40);
            rCtx.strokeRect(w.x - boxWidth/2, w.y - 20, boxWidth, 40);

            // Draw Word
            rCtx.font = "bold 18px 'Courier New'";
            rCtx.textAlign = "center";
            
            // Highlight text if it matches current buffer
            if (typingBuffer && w.text.startsWith(typingBuffer)) {
                rCtx.fillStyle = "#00ff88"; // Active word highlight
            } else {
                rCtx.fillStyle = "#fff"; 
            }
            rCtx.fillText(w.text, w.x, w.y + 7);

            // Fail if hits the bottom
            if (w.y > 480) { words.splice(i, 1); handleError(); }
        });
        requestAnimationFrame(drawRain);
    }

    function handleError() {
        playSfx(150, 'sawtooth', 0.2); errors++;
        document.getElementById('lives-display').innerText = `${errors} / ${maxErrors}`;
        if (errors >= maxErrors) { currentStage = 0; document.getElementById('fail-page').classList.add('flex-active'); }
    }

    window.addEventListener('keydown', (e) => {
        if (currentStage === 1 && e.code === 'Space') checkLock();
        if (currentStage === 2) {
            let key = e.key.toUpperCase();
            if (key.length !== 1) return;

            // Check if key continues any existing word on screen
            let matchFound = words.some(w => w.text.startsWith(typingBuffer + key));
            
            if (matchFound) {
                typingBuffer += key;
                playSfx(1000, 'sine', 0.05);
                
                // Check if any word is fully completed
                let fullMatchIdx = words.findIndex(w => w.text === typingBuffer);
                if (fullMatchIdx !== -1) {
                    words.splice(fullMatchIdx, 1);
                    hackProgress += 8; // Progress per word
                    typingBuffer = ""; 
                    playSfx(1300, 'square', 0.1);
                }
            } else {
                // Mistake made: Reset buffer and play fail sound
                typingBuffer = "";
                playSfx(150, 'sawtooth', 0.1);
            }
            
            document.getElementById('typing-buffer').innerText = typingBuffer || "_";
            document.getElementById('hack-pc').innerText = Math.floor(Math.min(100, hackProgress));
            if (hackProgress >= 100) finishGame();
        }
    });

    function finishGame() {
        currentStage = 0;
        clearTimeout(rainTimeout);
        document.getElementById('final-lives').innerText = (maxErrors - errors) + " / 5";
        document.getElementById('final-score').innerText = (hackProgress * 50) + ((maxErrors - errors) * 250);
        document.getElementById('win-page').classList.add('flex-active');
    }

    lCanvas.addEventListener('mousedown', () => { if(currentStage===1) checkLock(); });
    drawLockpick();
</script>
</body>
</html>
