<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM HACK: AUDIO ENABLED</title>
    <style>
        body {
            margin: 0; background: #050505; color: #00e6ff;
            font-family: 'Courier New', monospace; overflow: hidden;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        #game-container { position: relative; text-align: center; width: 450px; }
        .header { font-size: 20px; margin-bottom: 10px; text-shadow: 0 0 10px #00e6ff; }
        .sub-text { font-size: 12px; color: #555; margin-bottom: 20px; }
        #lives-container { color: #ff3333; font-weight: bold; margin-bottom: 10px; font-size: 18px; letter-spacing: 2px; }
        #stage-lockpick, #stage-letter-rain { display: none; }
        .active { display: block !important; }
        canvas { background: rgba(0, 230, 255, 0.02); border-radius: 10px; }
        #rain-canvas { border-bottom: 5px solid #ff3333; }
        .progress-container { display: flex; justify-content: space-between; margin-top: 15px; }
        .bar-bg { width: 30%; height: 10px; background: #222; border: 1px solid #444; }
        .bar-fill { height: 100%; width: 0%; background: #ff8c00; transition: 0.2s; }
        .shake { animation: shakeAnim 0.2s; }
        @keyframes shakeAnim {
            0% { transform: translate(3px, 3px); }
            50% { transform: translate(-3px, -3px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="stage-lockpick" class="active">
        <div class="header">STAGE 1: LOCKPICKING</div>
        <div class="sub-text">CLICK/SPACE TO REVERSE</div>
        <canvas id="lock-canvas" width="350" height="350"></canvas>
        <div class="progress-container">
            <div class="bar-bg"><div id="l1" class="bar-fill"></div></div>
            <div class="bar-bg"><div id="l2" class="bar-fill"></div></div>
            <div class="bar-bg"><div id="l3" class="bar-fill"></div></div>
        </div>
    </div>

    <div id="stage-letter-rain">
        <div id="lives-container">ERRORS: <span id="lives-display">0 / 3</span></div>
        <div class="header">STAGE 2: DECRYPTION (<span id="hack-pc">0</span>%)</div>
        <canvas id="rain-canvas" width="400" height="500"></canvas>
    </div>
</div>

<script>
    // --- AUDIO SYSTEM (Procedural Beeps) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // High A
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime); // Low buzz
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'unlock') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }
    }

    // --- GAME LOGIC ---
    let currentStage = 1;
    const container = document.getElementById('game-container');

    // Stage 1 Vars
    const lCanvas = document.getElementById('lock-canvas');
    const lCtx = lCanvas.getContext('2d');
    let lockProgress = [0, 0, 0];
    let activeLock = 0;
    let cursor = { angle: 0, speed: 0.05, dir: 1 };
    let target = { center: Math.random() * Math.PI * 2, width: 0.5 };

    function drawLockpick() {
        if (currentStage !== 1) return;
        lCtx.clearRect(0,0,350,350);
        lCtx.strokeStyle = "#222"; lCtx.lineWidth = 15;
        lCtx.beginPath(); lCtx.arc(175, 175, 130, 0, Math.PI*2); lCtx.stroke();
        lCtx.strokeStyle = "#00e6ff";
        lCtx.beginPath(); 
        lCtx.arc(175, 175, 130, target.center - target.width/2, target.center + target.width/2); 
        lCtx.stroke();
        cursor.angle += cursor.speed * cursor.dir;
        lCtx.strokeStyle = "#fff"; lCtx.lineWidth = 5;
        lCtx.beginPath();
        lCtx.moveTo(175 + 110 * Math.cos(cursor.angle), 175 + 110 * Math.sin(cursor.angle));
        lCtx.lineTo(175 + 145 * Math.cos(cursor.angle), 175 + 145 * Math.sin(cursor.angle));
        lCtx.stroke();
        requestAnimationFrame(drawLockpick);
    }

    function checkLock() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let diff = Math.abs(((cursor.angle % (Math.PI*2)) + (Math.PI*2)) % (Math.PI*2) - target.center);
        if (diff < target.width/2) {
            playSound('success');
            lockProgress[activeLock] += 34;
            document.getElementById(`l${activeLock+1}`).style.width = lockProgress[activeLock] + "%";
            if (lockProgress[activeLock] >= 100) {
                playSound('unlock');
                activeLock++;
                if (activeLock > 2) transitionToRain();
            }
            target.center = Math.random() * Math.PI * 2;
        } else {
            playSound('fail');
            lockProgress[activeLock] = 0;
            document.getElementById(`l${activeLock+1}`).style.width = "0%";
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 200);
        }
        cursor.dir *= -1;
    }

    // Stage 2 Vars
    const rCanvas = document.getElementById('rain-canvas');
    const rCtx = rCanvas.getContext('2d');
    let letters = [];
    let hackProgress = 0;
    let errors = 0;
    const maxErrors = 3;
    const lanes = [50, 150, 250, 350];
    let rainTimeout;

    function transitionToRain() {
        currentStage = 2;
        document.getElementById('stage-lockpick').classList.remove('active');
        document.getElementById('stage-letter-rain').classList.add('active');
        spawnLetter();
        drawRain();
    }

    function spawnLetter() {
        if (currentStage !== 2) return;
        let lane = Math.floor(Math.random() * 4);
        let char = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[Math.floor(Math.random()*26)];
        letters.push({ x: lanes[lane], y: -20, char: char });
        let delay = Math.max(350, 1200 - (hackProgress * 8));
        rainTimeout = setTimeout(spawnLetter, delay);
    }

    function drawRain() {
        if (currentStage !== 2) return;
        rCtx.clearRect(0,0,400,500);
        letters.forEach((l, i) => {
            l.y += 2 + (hackProgress / 20);
            rCtx.fillStyle = "rgba(0, 230, 255, 0.15)";
            rCtx.fillRect(l.x - 35, l.y - 25, 70, 50);
            rCtx.strokeStyle = "#00e6ff";
            rCtx.strokeRect(l.x - 35, l.y - 25, 70, 50);
            rCtx.fillStyle = "#fff";
            rCtx.font = "bold 28px Arial";
            rCtx.textAlign = "center";
            rCtx.fillText(l.char, l.x, l.y + 10);
            if (l.y > 480) {
                letters.splice(i, 1);
                handleError();
            }
        });
        requestAnimationFrame(drawRain);
    }

    function handleError() {
        playSound('fail');
        errors++;
        document.getElementById('lives-display').innerText = `${errors} / ${maxErrors}`;
        container.classList.add('shake');
        setTimeout(() => container.classList.remove('shake'), 200);
        if (errors >= maxErrors) resetToStart();
    }

    function resetToStart() {
        clearTimeout(rainTimeout);
        currentStage = 1;
        errors = 0; hackProgress = 0; activeLock = 0; lockProgress = [0,0,0]; letters = [];
        document.getElementById('lives-display').innerText = "0 / 3";
        document.getElementById('hack-pc').innerText = "0";
        for(let i=1;i<=3;i++) document.getElementById(`l${i}`).style.width = "0%";
        document.getElementById('stage-letter-rain').classList.remove('active');
        document.getElementById('stage-lockpick').classList.add('active');
        drawLockpick();
    }

    window.addEventListener('keydown', (e) => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (currentStage === 1 && e.code === 'Space') checkLock();
        if (currentStage === 2) {
            let key = e.key.toUpperCase();
            let hitIndex = -1;
            let lowestY = -1;
            for(let i=0; i<letters.length; i++) {
                if(letters[i].char === key && letters[i].y > lowestY) {
                    lowestY = letters[i].y;
                    hitIndex = i;
                }
            }
            if (hitIndex !== -1) {
                playSound('success');
                letters.splice(hitIndex, 1);
                hackProgress += 2.5;
                document.getElementById('hack-pc').innerText = Math.floor(hackProgress);
                if (hackProgress >= 100) location.reload();
            } else {
                handleError();
            }
        }
    });

    lCanvas.addEventListener('mousedown', checkLock);
    drawLockpick();
</script>
</body>
</html>
